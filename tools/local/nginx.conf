# PRDUCT assessment — local release server (official nginx image, host network).
# Serves the current local build (tools/local_site.sh build) on 127.0.0.1:8090; tailscale serve puts it on
# the tailnet at https://nezopt.tail75dcfc.ts.net:8443. Mirrors vercel.json: media and fonts are immutable,
# everything else no-store; /pathfinder rewrite; /api/* goes to the local API (assessment/server.py :8787).
server {
  listen 127.0.0.1:8090;
  server_name _;
  root /srv/prduct/current;          # a symlink to releases/<stamp>: a new build switches atomically
  index index.html;
  absolute_redirect off;             # tailscale serve is in front: keep redirects relative
  charset utf-8;
  charset_types text/css application/javascript text/javascript application/json image/svg+xml;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  location = /pathfinder  { try_files /pathfinder.html =404; }
  location = /pathfinder/ { try_files /pathfinder.html =404; }

  location /api/ { return 404; }       # only the API routes below reach the API
  location ~ ^/api/(submit|submissions|session|health)$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 256k;
    add_header Cache-Control "no-store" always;
  }

  location /journey/media/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;             # byte ranges are on by default: iOS / Safari video needs them
  }
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ =404;
  }
}
