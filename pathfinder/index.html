<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prduct · Data Pathfinder</title>
  <link rel="preload" href="https://prduct.com/wp-content/themes/product-2026/assets/fonts/montserrat-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="https://prduct.com/wp-content/themes/product-2026/assets/fonts/montserrat-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="https://prduct.com/wp-content/themes/product-2026/assets/fonts/montserrat-700.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    :root {
      --paper: #f7f4ef;
      --graphite: #2c2a26;
      --ash: #8a8580;
      --oak: #c4a882;
      --moss: #5c6b4a;
      --oxidized: #6e7a72;
      --ink: #1e3a5f;
      --line: #d9d3c9;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--paper); color: var(--graphite);
      font-family: Montserrat, system-ui, sans-serif;
      font-weight: 400; line-height: 1.5;
    }
    body { padding: 2.5rem 1.5rem 4rem; }
    .wrap { max-width: 40rem; margin: 0 auto; }
    .brand {
      font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ash); font-weight: 600; margin-bottom: 2.5rem;
    }
    h1 {
      font-size: clamp(1.35rem, 3vw, 1.75rem); font-weight: 700;
      letter-spacing: -0.02em; margin: 0 0 .75rem; max-width: 28ch;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .spine-rail {
      margin: 0 0 1.25rem;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: .85rem 0;
    }
    /* Six equal seats — all labels scannable; scroll only as last resort */
    .spine {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-wrap: nowrap; align-items: flex-start;
      gap: 0; width: 100%;
      overflow-x: visible;
    }
    .spine .node {
      flex: 1 1 0;
      min-width: 0;
      font-size: clamp(.5rem, 1.7vw, .65rem);
      letter-spacing: .06em; text-transform: uppercase;
      color: var(--ash); font-weight: 600;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start; gap: .35rem;
      text-align: center; padding: .1rem .05rem;
      line-height: 1.25;
    }
    .spine .node > span:not(.dot) {
      display: block; width: 100%;
      overflow-wrap: normal; word-break: keep-all; hyphens: none;
      white-space: normal;
    }
    .spine .node .label-full { display: block; }
    .spine .node .label-short { display: none; }
    @media (max-width: 520px) {
      .spine .node .label-full { display: none; }
      .spine .node .label-short { display: block; letter-spacing: .04em; }
    }
    .spine .node[data-current="true"] { color: var(--graphite); }
    .spine .node[data-state="latent"] { opacity: .55; color: var(--ash); }
    .spine .node[data-state="visited"],
    .spine .node[data-state="evidenced"] { color: var(--graphite); opacity: 1; }
    .spine .node[data-state="connected"],
    .spine .node[data-state="verified"] { color: var(--moss); opacity: 1; }
    .spine .node[data-state="uncertain"],
    .spine .node[data-state="fractured"] { color: var(--oxidized); opacity: 1; }
    .dot {
      width: .45rem; height: .45rem; border-radius: 50%;
      border: 1px solid currentColor; background: transparent; flex: 0 0 auto;
    }
    .spine .node[data-state="visited"] .dot,
    .spine .node[data-state="uncertain"] .dot,
    .spine .node[data-state="evidenced"] .dot,
    .spine .node[data-state="connected"] .dot,
    .spine .node[data-state="verified"] .dot { background: currentColor; }
    .spine .edge {
      flex: 0 0 clamp(.35rem, 1.5vw, .85rem);
      width: clamp(.35rem, 1.5vw, .85rem); height: 0;
      margin: .55rem 0 0; align-self: flex-start;
      border: 0; border-top: 1px solid var(--line);
    }
    .spine .edge[data-edge="latent"] { opacity: .55; border-top-style: solid; }
    .spine .edge[data-edge="hairline"] { opacity: .7; border-top-style: solid; }
    .spine .edge[data-edge="solid"] {
      opacity: 1; border-top-color: var(--moss); border-top-style: solid;
    }
    .spine .edge[data-edge="double"] {
      height: 3px; opacity: 1;
      border-top: 1px solid var(--moss);
      border-bottom: 1px solid var(--moss);
      background: transparent;
    }
    .spine .edge[data-edge="dashed"] {
      opacity: 1; border-top-color: var(--oxidized); border-top-style: dashed;
    }
    .spine .edge[data-edge="gap"] {
      border-top-color: transparent; position: relative;
    }
    .spine .edge[data-edge="gap"]::before,
    .spine .edge[data-edge="gap"]::after {
      content: ""; position: absolute; top: -1px; width: .22rem; height: 1px;
      background: var(--oxidized);
    }
    .spine .edge[data-edge="gap"]::before { left: 0; }
    .spine .edge[data-edge="gap"]::after { right: 0; }
    /* Extreme narrow: still prefer equal seats; allow gentle rail scroll only then */
    @media (max-width: 320px) {
      .spine {
        overflow-x: auto; -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
      }
      .spine .node {
        flex: 0 0 auto; min-width: 3.25rem;
        scroll-snap-align: center;
      }
      .spine .edge { flex: 0 0 .55rem; width: .55rem; }
    }
    .legend {
      display: flex; flex-wrap: wrap; gap: .65rem 1.1rem;
      margin: 0 0 2rem; padding: 0;
      list-style: none; font-size: .65rem; color: var(--ash); letter-spacing: .04em;
    }
    .legend li { display: flex; align-items: center; gap: .4rem; }
    .legend .swatch {
      width: 1.1rem; height: 0; border-top: 1px solid currentColor; display: inline-block;
    }
    .legend .swatch.solid { border-top-color: var(--moss); }
    .legend .swatch.dashed { border-top-style: dashed; border-top-color: var(--oxidized); }
    .legend .swatch.gap {
      border-top-color: transparent; position: relative; width: 1rem;
    }
    .legend .swatch.gap::before,
    .legend .swatch.gap::after {
      content: ""; position: absolute; top: -1px; width: .25rem; height: 1px;
      background: var(--oxidized);
    }
    .legend .swatch.gap::before { left: 0; }
    .legend .swatch.gap::after { right: 0; }

    /* Sector object — Danish restraint, one CSS transition per decision */
    .sector-object {
      margin: 0 0 1.5rem;
      padding: .85rem 0 0;
      border-top: 1px solid transparent;
    }
    .sector-object[data-visible="true"] { border-top-color: var(--line); }
    .sector-object .so-frame {
      position: relative;
      width: min(100%, 11.5rem);
      height: 5.5rem;
      margin: 0 auto;
    }
    .sector-object svg {
      display: block; width: 100%; height: 100%;
      overflow: visible;
    }
    .sector-object .layer {
      fill: none;
      stroke: var(--ash);
      stroke-width: 1.25;
      transition: transform .45s ease, opacity .45s ease, stroke .45s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .sector-object[data-state="assembled"] .layer { opacity: .85; }
    .sector-object[data-state="exploded"] .layer { stroke: var(--graphite); }
    .sector-object[data-state="exploded"] .layer:nth-child(1) { transform: translateY(-10px); }
    .sector-object[data-state="exploded"] .layer:nth-child(2) { transform: translateY(-4px); }
    .sector-object[data-state="exploded"] .layer:nth-child(3) { transform: translateY(2px); }
    .sector-object[data-state="exploded"] .layer:nth-child(4) { transform: translateY(8px); }
    .sector-object[data-state="exploded"] .layer:nth-child(5) { transform: translateY(14px); opacity: .55; }
    .sector-object[data-state="boundary"] .layer { stroke: var(--oxidized); }
    .sector-object[data-state="boundary"] .layer:nth-child(1),
    .sector-object[data-state="boundary"] .layer:nth-child(2) {
      transform: translateX(-8px); opacity: .9;
    }
    .sector-object[data-state="boundary"] .layer:nth-child(4),
    .sector-object[data-state="boundary"] .layer:nth-child(5) {
      transform: translateX(8px); opacity: .55;
    }
    .sector-object[data-state="reunited"] .layer {
      stroke: var(--moss); opacity: 1; transform: none;
    }
    .sector-object[data-motion="separate"] .layer,
    .sector-object[data-motion="connect"] .layer,
    .sector-object[data-motion="join"] .layer,
    .sector-object[data-motion="settle"] .layer {
      transition-duration: .5s;
    }
    @media (prefers-reduced-motion: reduce) {
      /* Quiet presence stays; verbs only shift opacity/border — no layer travel */
      .sector-object .layer {
        transition: opacity .2s ease, stroke .2s ease, fill .2s ease, stroke-width .2s ease;
        transform: none !important;
      }
      .sector-object[data-state="exploded"] .layer,
      .sector-object[data-state="boundary"] .layer,
      .sector-object[data-state="reunited"] .layer {
        transform: none !important;
      }
      .sector-object[data-state="exploded"] .layer { opacity: .55; stroke: var(--graphite); }
      .sector-object[data-state="boundary"] .layer { opacity: .7; stroke: var(--oxidized); stroke-dasharray: 3 3; }
      .sector-object[data-state="reunited"] .layer { opacity: .9; stroke: var(--moss); }
    }
    .sector-object .so-caption {
      margin: .55rem 0 0;
      text-align: center;
      font-size: .65rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--ash); font-weight: 600;
    }

    .prompt { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
    .detail { color: var(--ash); margin: 0 0 1.5rem; font-size: .95rem; max-width: 46ch; }
    .opts { display: grid; gap: .6rem; }
    button.opt, button.nav {
      text-align: left; width: 100%; cursor: pointer;
      background: transparent; border: 1px solid var(--line);
      color: var(--graphite); border-radius: .15rem;
      padding: .9rem 1rem; font: inherit; font-weight: 500;
      transition: border-color .15s, background .15s;
    }
    button.opt:hover, button.opt:focus-visible,
    button.nav:hover, button.nav:focus-visible {
      border-color: var(--graphite); outline: none; background: #fff;
    }
    .nav-row {
      display: flex; gap: .6rem; margin-top: 1.25rem; flex-wrap: wrap;
    }
    .nav-row button.nav {
      width: auto; min-width: 6.5rem;
      font-size: .8rem; letter-spacing: .04em; text-transform: uppercase;
      font-weight: 600; color: var(--ash); padding: .55rem .9rem;
    }
    .landscape {
      border-top: 1px solid var(--line); padding-top: 1.75rem; margin-top: .25rem;
    }
    .landscape h2 {
      font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--ink); margin: 0 0 1.25rem;
    }
    .block { margin-bottom: 1.35rem; }
    .block h3 {
      font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--ash); margin: 0 0 .35rem; font-weight: 700;
    }
    .block p { margin: 0; font-size: .98rem; }

    /* Quiet passport plate — Horizon only; no consequence banner */
    .passport-plate {
      margin: 1.75rem 0 0;
      padding: 1.1rem 0 0;
      border-top: 1px solid var(--line);
    }
    .passport-plate .plate-title {
      font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--ash); margin: 0 0 .85rem; font-weight: 600;
    }
    .plate-rows {
      list-style: none; margin: 0; padding: 0;
      display: grid; gap: .55rem;
    }
    .plate-rows li {
      display: grid;
      grid-template-columns: 1.1rem minmax(0, 1fr) auto;
      align-items: center; gap: .65rem;
      font-size: .9rem; color: var(--graphite);
      min-height: 1.35rem;
    }
    .plate-rows .seat {
      width: .7rem; height: .7rem;
      border: 1px solid var(--line);
      border-radius: .05rem;
      background: transparent;
      justify-self: center;
    }
    .plate-rows li[data-status="verified"] .seat {
      background: var(--graphite);
      border-color: var(--graphite);
    }
    .plate-rows li[data-status="hairline"] .seat {
      border: 0; border-top: 1px solid var(--ash);
      height: 0; width: .85rem; border-radius: 0;
      margin-top: .35rem;
    }
    .plate-rows li[data-status="absent"] .seat {
      background: transparent; border-color: var(--line);
    }
    .plate-rows .row-label { font-weight: 500; }
    .plate-rows .row-cue {
      font-size: .65rem; letter-spacing: .04em;
      color: var(--ash); text-align: right;
    }
    .plate-rows li[data-status="verified"] .row-cue,
    .plate-rows li[data-status="absent"] .row-cue { visibility: hidden; }
    .plate-caveat {
      margin: .85rem 0 0;
      font-size: .75rem; color: var(--ash); max-width: 48ch;
    }

    .cta-row {
      display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.75rem;
    }
    a.cta, button.cta {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; cursor: pointer;
      border: 1px solid var(--graphite); background: var(--graphite); color: var(--paper);
      border-radius: .15rem; padding: .75rem 1.1rem;
      font: inherit; font-size: .85rem; font-weight: 600; letter-spacing: .02em;
    }
    a.cta.secondary, button.cta.secondary {
      background: transparent; color: var(--graphite); border-color: var(--line);
    }
    a.cta.secondary:hover, button.cta.secondary:hover,
    a.cta.secondary:focus-visible, button.cta.secondary:focus-visible {
      border-color: var(--graphite); outline: none;
    }
    .note { margin-top: 2.5rem; font-size: .75rem; color: var(--ash); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">Prduct · Data Pathfinder</p>
    <div class="spine-rail">
      <ol class="spine" id="spine" aria-label="Product data spine"></ol>
    </div>
    <ul class="legend" id="legend" hidden aria-label="Spine edge legend">
      <li><span class="swatch solid" aria-hidden="true"></span> Connected</li>
      <li><span class="swatch dashed" aria-hidden="true"></span> Uncertain</li>
      <li><span class="swatch gap" aria-hidden="true"></span> Fractured</li>
    </ul>
    <div id="sector-object" class="sector-object" data-visible="false" aria-hidden="true"></div>
    <div id="view"></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <p class="note">Staging surface. Live assessment remains at the site root.</p>
  </main>
  <script type="module">
    import {
      createState,
      getSituation,
      answer,
      undo,
      isComplete,
      finalize,
      SPINE_NODES,
      getScenario
    } from "/pathfinder/index.js";

    const LABELS = {
      supplier: "Supplier",
      material: "Material",
      component: "Component",
      product: "Product",
      customer: "Customer",
      nextLife: "Next Life"
    };
    const SHORT_LABELS = {
      supplier: "Sup",
      material: "Mat",
      component: "Comp",
      product: "Prod",
      customer: "Cust",
      nextLife: "Next"
    };

    let state = createState();
    const spineEl = document.getElementById("spine");
    const legendEl = document.getElementById("legend");
    const sectorEl = document.getElementById("sector-object");
    const view = document.getElementById("view");
    const live = document.getElementById("live");
    let lastAnnounce = "";

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function edgeKind(left, right) {
      const L = left || "latent";
      const R = right || "latent";
      if (L === "fractured" || R === "fractured") return "gap";
      if (L === "uncertain" || R === "uncertain") return "dashed";
      if (L === "verified" || R === "verified") return "double";
      const strong = new Set(["connected", "evidenced", "verified"]);
      if (strong.has(L) && strong.has(R)) return "solid";
      if (strong.has(L) || strong.has(R) || L === "connected" || R === "connected") return "solid";
      if (L === "visited" || R === "visited" || L === "evidenced" || R === "evidenced") return "hairline";
      if (L === "latent" && R === "latent") return "latent";
      return "hairline";
    }

    function currentSpineIds(st) {
      const ids = new Set();
      // First paint / persona select: keep every node latent until an answer.
      if (!st.history?.length) return ids;
      if (st.currentNode && st.currentNode !== "reveal.landscape") {
        try {
          const sc = getScenario(st.currentNode);
          for (const id of sc.spineTouch || []) ids.add(id);
        } catch (_) { /* ignore */ }
      }
      if (!ids.size) {
        for (const id of SPINE_NODES) {
          const s = st.spine?.[id]?.state;
          if (s && s !== "latent") ids.add(id);
        }
      }
      return ids;
    }

    function spineHasChanged(st) {
      return SPINE_NODES.some((id) => (st.spine?.[id]?.state || "latent") !== "latent");
    }

    function announce(msg) {
      if (!msg || msg === lastAnnounce) return;
      lastAnnounce = msg;
      live.textContent = msg;
    }

    function renderSpine() {
      spineEl.innerHTML = "";
      const current = currentSpineIds(state);
      for (let i = 0; i < SPINE_NODES.length; i++) {
        const id = SPINE_NODES[i];
        const node = state.spine?.[id] || { state: "latent" };
        const li = document.createElement("li");
        li.className = "node";
        li.dataset.state = node.state || "latent";
        li.dataset.node = id;
        if (current.has(id)) li.dataset.current = "true";
        li.innerHTML = `<span class="dot" aria-hidden="true"></span><span class="label-full">${LABELS[id] || id}</span><span class="label-short" aria-hidden="true">${SHORT_LABELS[id] || LABELS[id] || id}</span>`;
        spineEl.appendChild(li);

        if (i < SPINE_NODES.length - 1) {
          const nextId = SPINE_NODES[i + 1];
          const next = state.spine?.[nextId] || { state: "latent" };
          const edge = document.createElement("li");
          edge.className = "edge";
          edge.dataset.edge = edgeKind(node.state, next.state);
          edge.setAttribute("aria-hidden", "true");
          spineEl.appendChild(edge);
        }
      }
      legendEl.hidden = !spineHasChanged(state);
      // Equal-seat layout shows all six; only scroll-pin on extreme narrow overflow.
      if (window.matchMedia("(max-width: 320px)").matches) {
        const pin = spineEl.querySelector('.node[data-current="true"]');
        if (pin && typeof pin.scrollIntoView === "function") {
          try { pin.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); }
          catch (_) { /* ignore */ }
        }
      }
    }

    function metaphorLayers(metaphor) {
      if (metaphor === "chair-joinery") {
        return `
          <rect class="layer" x="28" y="18" width="64" height="14" rx="1"/>
          <path class="layer" d="M34 32 L34 58 M86 32 L86 58"/>
          <path class="layer" d="M34 58 L86 58"/>
          <path class="layer" d="M40 40 L80 40"/>
          <path class="layer" d="M48 22 L48 12 M72 22 L72 12"/>`;
      }
      if (metaphor === "battery-layers") {
        return `
          <rect class="layer" x="30" y="14" width="60" height="52" rx="2"/>
          <rect class="layer" x="38" y="22" width="44" height="10" rx="1"/>
          <rect class="layer" x="38" y="36" width="44" height="10" rx="1"/>
          <rect class="layer" x="38" y="50" width="44" height="8" rx="1"/>
          <path class="layer" d="M54 10 L66 10 L66 14 L54 14 Z"/>`;
      }
      return `
        <rect class="layer" x="32" y="16" width="56" height="48" rx="2"/>
        <rect class="layer" x="40" y="24" width="40" height="12" rx="1"/>
        <rect class="layer" x="40" y="40" width="40" height="8" rx="1"/>
        <path class="layer" d="M40 56 L80 56"/>
        <circle class="layer" cx="60" cy="48" r="3"/>`;
    }

    function renderSectorObject() {
      const so = state.sectorObject;
      const objectState = state.objectState || "assembled";
      const verb = state.lastMotion?.verb || "";
      const firstPaint = !state.history?.length;
      if (!so) {
        sectorEl.dataset.visible = "false";
        sectorEl.setAttribute("aria-hidden", "true");
        sectorEl.innerHTML = "";
        return;
      }
      const metaphor = so.metaphor || "product-assembly";
      const quiet = firstPaint ? "assembled" : objectState;
      // First paint: assembled, quiet — do not hot-pin Product spine
      sectorEl.dataset.visible = "true";
      sectorEl.dataset.state = quiet;
      sectorEl.dataset.motion = firstPaint ? "" : verb;
      sectorEl.dataset.metaphor = metaphor;
      sectorEl.removeAttribute("aria-hidden");
      const caption = firstPaint
        ? "Product"
        : (metaphor === "chair-joinery"
            ? "Joinery"
            : metaphor === "battery-layers"
              ? "Layers"
              : "Assembly");
      sectorEl.innerHTML = `
        <div class="so-frame" aria-hidden="true">
          <svg viewBox="0 0 120 80" role="presentation">${metaphorLayers(metaphor)}</svg>
        </div>
        <p class="so-caption">${escapeHtml(caption)}</p>`;
    }

    function pickLandscape(result) {
      if (!result) return {};
      if (typeof result === "string") return { foundation: result };
      const foundation = result.foundation?.explanation || result.foundation?.summary || result.foundation;
      const fracture = result.fragmentation?.explanation || result.fracture?.explanation || result.fracture;
      const nextMove = result.nextCapability
        ? [result.nextCapability.why, result.nextCapability.firstMove].filter(Boolean).join(" ")
        : (result.nextMove?.summary || result.nextMove || "");
      const opp = Array.isArray(result.opportunities) && result.opportunities[0]
        ? (result.opportunities[0].label || result.opportunities[0].id)
        : (result.opportunity?.summary || result.opportunity || "");
      const dppPlate = result.dppPlate || null;
      return { foundation, fracture, nextMove, opportunity: opp, dppPlate };
    }

    function plateBlock(plate) {
      if (!plate || !Array.isArray(plate.rows) || !plate.rows.length) return "";
      const title = escapeHtml(plate.title || "Product data passport");
      const rows = plate.rows.map((row) => {
        const status = row.status === "verified" || row.status === "hairline" || row.status === "absent"
          ? row.status
          : "absent";
        const cue = status === "hairline" ? "claimed, not proven" : "";
        return `<li data-row="${escapeHtml(row.id || "")}" data-status="${status}">
          <span class="seat" aria-hidden="true"></span>
          <span class="row-label">${escapeHtml(row.label || row.id || "")}</span>
          <span class="row-cue">${escapeHtml(cue)}</span>
        </li>`;
      }).join("");
      const caveat = plate.caveat
        ? `<p class="plate-caveat">${escapeHtml(plate.caveat)}</p>`
        : "";
      return `<section class="passport-plate" data-kind="${escapeHtml(plate.kind || "passport-plate")}" aria-label="${title}">
        <h3 class="plate-title">${title}</h3>
        <ul class="plate-rows">${rows}</ul>
        ${caveat}
      </section>`;
    }

    function renderLandscape(result) {
      const r = result || {};
      view.innerHTML = `
        <div class="landscape">
          <h2>Your product data landscape</h2>
          <div class="block"><h3>Your strongest foundation</h3><p>${escapeHtml(r.foundation || "—")}</p></div>
          <div class="block"><h3>Where information gets lost</h3><p>${escapeHtml(r.fracture || "—")}</p></div>
          <div class="block"><h3>Make this reliable next</h3><p>${escapeHtml(r.nextMove || "—")}</p></div>
          <div class="block"><h3>Opportunity</h3><p>${escapeHtml(r.opportunity || "—")}</p></div>
          ${plateBlock(r.dppPlate)}
          <div class="cta-row">
            <button type="button" class="cta" id="cta-restart">Explore your path</button>
            <a class="cta secondary" href="https://prduct.com/contact">Talk through this landscape</a>
          </div>
          <div class="nav-row">
            <button type="button" class="nav" id="btn-back" ${state.history?.length ? "" : "disabled"}>Back</button>
          </div>
        </div>`;
      view.querySelector("#cta-restart")?.addEventListener("click", () => {
        state = createState();
        lastAnnounce = "";
        render();
      });
      view.querySelector("#btn-back")?.addEventListener("click", goBack);
      announce("Landscape ready. Your product data landscape is visible.");
    }

    function goBack() {
      if (!state.history?.length) return;
      state = undo(state);
      render();
    }

    function render() {
      renderSpine();
      renderSectorObject();
      if (isComplete(state)) {
        if (!state.result) state = finalize(state);
        renderLandscape(pickLandscape(state.result));
        return;
      }
      const sit = getSituation(state);
      const opts = (sit.options || [])
        .map(
          (o) =>
            `<button type="button" class="opt" data-id="${escapeHtml(o.id)}">${escapeHtml(o.label)}</button>`
        )
        .join("");
      const context = sit.detail || "";
      view.innerHTML = `
        <h1 class="prompt">${escapeHtml(sit.prompt || "")}</h1>
        ${context ? `<p class="detail">${escapeHtml(context)}</p>` : ""}
        <div class="opts" role="group" aria-label="Choose">${opts}</div>
        <div class="nav-row">
          <button type="button" class="nav" id="btn-back" ${state.history?.length ? "" : "disabled"}>Back</button>
        </div>`;
      view.querySelectorAll("button.opt").forEach((btn) => {
        btn.addEventListener("click", () => {
          state = answer(state, btn.dataset.id);
          render();
        });
      });
      view.querySelector("#btn-back")?.addEventListener("click", goBack);
      const hint = sit.prompt || "Next situation";
      announce(hint);
    }

    render();
  </script>
</body>
</html>
