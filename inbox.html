<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Prduct | Assessment responses</title>
  <link rel="icon" type="image/svg+xml" href="https://prduct.com/wp-content/themes/product-2026/assets/static/favicon.svg" />
  <link rel="stylesheet" href="https://prduct.com/wp-content/themes/product-2026/style.css?v=b31c204c64" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .inbox-lock { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2rem; }
    .inbox-qr { display: flex; align-items: center; gap: 1rem; max-width: 22rem; padding: 1rem; border-radius: 1rem; background: #fff; }
    .inbox-qr img { width: 112px; height: 112px; flex: none; }
    .inbox-user { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="font-montserrat bg-slate-50 text-slate-900">
  <div class="container mx-auto px-4 py-10">
    <p class="mb-4 text-sm"><a class="text-violet-700 hover:underline" href="/">← Furniture DPP assessment</a></p>
    <p class="text-xs font-bold uppercase tracking-wide text-violet-600">Captured data</p>
    <h1 class="mt-2 text-2xl font-bold lg:text-3xl">Readiness responses</h1>
    <p class="mt-2 mb-6 text-sm text-slate-600" id="meta">Loading…</p>
    <div class="inbox-lock mb-8" id="lock" hidden>
      <!-- A plain form post (not fetch): password managers such as iCloud Keychain recognise it, offer to save the
           password and fill it next time with Face ID / Touch ID. -->
      <form class="flex flex-wrap items-center gap-3" id="unlock" method="post" action="/api/session">
        <input class="inbox-user" type="text" name="username" value="prduct-inbox" autocomplete="username" tabindex="-1" aria-hidden="true" readonly />
        <label class="text-sm font-semibold" for="pw">Password</label>
        <input class="pr-input" id="pw" name="password" type="password" autocomplete="current-password" required style="max-width: 18rem" />
        <button class="btn-primary px-5 py-2 text-xs" type="submit">Open inbox</button>
        <span class="err" id="err" role="alert"></span>
      </form>
      <div class="inbox-qr" id="qr" hidden>
        <img alt="QR code that opens this inbox on your phone" />
      </div>
    </div>
    <div id="inbox" hidden>
      <form class="mb-4" method="post" action="/api/session">
        <input type="hidden" name="action" value="logout" />
        <button class="btn-secondary px-4 py-2 text-xs" type="submit">Lock inbox</button>
      </form>
      <div class="overflow-auto rounded-2xl bg-white p-4">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-xs uppercase tracking-wide text-slate-500">
              <th class="py-2 pr-3">When</th>
              <th class="py-2 pr-3">Lead</th>
              <th class="py-2 pr-3">Company</th>
              <th class="py-2 pr-3">Type</th>
              <th class="py-2 pr-3">Timeline</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    // The list comes from /api/submissions, which answers only to the session cookie that /api/session sets after
    // the right password (HttpOnly: this page never holds the password). Every value from the form is escaped.
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const QR = { "demosprint.vercel.app": "inbox-qr-vercel.svg", "nezopt.tail75dcfc.ts.net:8443": "inbox-qr-tailnet.svg" };

    function rowsHtml(list) {
      return list.slice().reverse().map((s) => {
        const lead = s.lead || {};
        const p = s.personality || {};
        const sc = s.scores || {};
        return `<tr class="border-b border-slate-100 align-top">
          <td class="py-3 pr-3 whitespace-nowrap">${esc((s.receivedAt || "").replace("T", " ").slice(0, 19))}</td>
          <td class="py-3 pr-3"><strong>${esc(lead.firstName)} ${esc(lead.lastName)}</strong><br>${esc(lead.email)}<br>${esc(lead.role)}</td>
          <td class="py-3 pr-3">${esc(lead.company)}</td>
          <td class="py-3 pr-3">${esc(p.name || "—")}</td>
          <td class="py-3 pr-3">${esc((sc.timeline && sc.timeline.display) || "—")}</td>
        </tr>`;
      }).join("") || "<tr><td class='py-4' colspan='5'>No submissions yet.</td></tr>";
    }

    function showLock() {
      const params = new URLSearchParams(location.search);
      if (params.has("error")) {
        $("err").textContent = "Wrong password.";
        history.replaceState(null, "", location.pathname);
      }
      $("meta").textContent = "This inbox is locked. Enter the password to see the responses.";
      const qr = QR[location.host];
      const phone = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
      if (qr && !phone) {
        $("qr").querySelector("img").src = qr;
        $("qr").hidden = false;
      }
      $("lock").hidden = false;
    }

    function render(d) {
      let local = [];
      try { local = JSON.parse(localStorage.getItem("prduct-dpp-submissions") || "[]"); } catch {}
      const byKey = new Map();
      [...(d.submissions || []), ...local].forEach((s) => byKey.set(((s.lead && s.lead.email) || "") + (s.receivedAt || s.id || ""), s));
      const merged = [...byKey.values()];
      $("meta").textContent = merged.length + " responses (name, email, company, role, scored answers).";
      $("rows").innerHTML = rowsHtml(merged);
      $("inbox").hidden = false;
    }

    // A pasted or autofilled password arrives in one go: submit it straight away, so a saved password is one tap.
    let typed = 0;
    $("pw").addEventListener("input", () => {
      const n = $("pw").value.length;
      if (typed === 0 && n >= 16) $("unlock").requestSubmit();
      typed = n;
    });

    fetch("/api/submissions", { cache: "no-store", credentials: "same-origin" })
      .then((r) => {
        if (r.status === 401) return showLock();
        if (!r.ok) throw new Error("The inbox could not be loaded (" + r.status + ").");
        return r.json().then(render);
      })
      .catch((err) => { $("meta").textContent = err.message; });
  </script>
</body>
</html>
